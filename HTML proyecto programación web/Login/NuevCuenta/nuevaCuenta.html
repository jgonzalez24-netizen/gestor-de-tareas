<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTask - Crear cuenta</title>
    <link rel="stylesheet" href="styleNuevaCuenta.css">
    
</head>
<body>

    <header class="logo-container">
        <h1>EduTask</h1>
        <p>Planificación académica</p>
    </header>

    <main class="card">

        <h2>Crear cuenta</h2>
        <p class="subtitle">
            Empieza a organizar tu tiempo académico.
        </p>

        <form>

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" placeholder="Tus apellidos">
            </div>

            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="tu.correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="password-field">
                    <input type="password" placeholder="Crea una contraseña">
                    <button type="button"> 👁 Mostrar</button>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <div class="password-field">
                    <input type="password" placeholder="Repite tu contraseña">
                    <button type="button"> 👁 Mostrar</button>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">
                    Acepto los <a href="#">términos de uso</a>
                </label>
            </div>

            <a href="../Login.html" class="login-link">Crear cuenta</a>
            
           

        </form>

        <p class="login-link">
            ¿Ya tienes una cuenta?
            <a href="../Login.html" class="subtitle">Iniciar sesión</a>
        </p>

    </main>

</body>
</html>

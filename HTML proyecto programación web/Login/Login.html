<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTask - Login</title>
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>

    <div class="login-container">

        <div class="logo-section">
            <h1>EduTask</h1>
            <p>Planificación académica</p>
        </div>

        <div class="card">

            <h2>Bienvenido a EduTask</h2>
            <p class="subtitle">
                Organiza tus tareas y planifica tu tiempo académico
            </p>

            <form>

                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    placeholder="usuario@ejemplo.com"
                >

                <label for="password">Contraseña</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                    >
                    <button type="button">Mostrar</button>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <a href="Inicio/inicio.html" class="login-btn">Inicar sesión</a>

            </form>

            <hr>

            <p class="register">
                ¿No tienes una cuenta?
                <a href="#">Crear cuenta</a>
            </p>

        </div>

    </div>

</body>
</html>

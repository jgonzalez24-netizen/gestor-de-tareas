<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Recupera contraseña</title>
    <link rel="stylesheet" href=".../cambiarContrasenia/verificarcodigo/recuperarContrasenna.css">
    
</head>
<body>

    <header class="logo-container">
        <h1>EduTask</h1>
        <p>Planificación académica</p>
    </header>

    <main class="card">

        <h2>Recupera contraseña</h2>
        <p class="subtitle">
            Ingresa tu correo electrónico y te enviamos un código de verificaión
        </p>

        <form>

            <div class="form-group">
                <label>Nueva contraseña</label>
                <input type="email" placeholder="Ingresa tu nueva Contraseña">
            </div>
             

        </form>

        <form >
            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Repite tu nueva Contraseña">
            </div>   

        </form>

        <button onclick="window.location.href='confirmacionCa/confirmacion.html'" class="submit-btn">Guardar contraseña</button>

    </main>

</body>
</html>
